name: Deploy VPS

# Deploy sob demanda, pelo botão "Run workflow" na aba Actions.
#
# Por que isto existe: o deploy sempre dependeu de alguém abrir um terminal e
# rodar `ssh root@195.35.17.102 ...` da própria máquina. Quem trabalha no
# repositório de dentro de um ambiente sem saída na porta 22 — o Claude Code na
# nuvem, por exemplo — consegue corrigir, testar e commitar, e trava no último
# passo. O runner do GitHub tem saída na 22, então ele faz a ponte.
#
# NÃO dispara sozinho no push. Deploy é ação de fora para dentro e com
# consequência para quem está usando o app agora; quem aperta é uma pessoa.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch ou commit a publicar (o script exige que seja o mesmo commit de origin/master)'
        required: false
        default: 'master'
      version:
        description: 'Rótulo arbitrário que força o runner a executar o job real em vez de reutilizar o cache de um run anterior (qualquer texto serve)'
        required: false
        default: 'v1'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Segredo ausente falha aqui, com o nome do segredo e onde cadastrar, em
      # vez de falhar dez linhas abaixo com "Permission denied (publickey)".
      - name: Conferir segredos
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          FALTA=""
          [ -n "$VPS_SSH_KEY" ] || FALTA="$FALTA VPS_SSH_KEY"
          [ -n "$VPS_HOST" ] || FALTA="$FALTA VPS_HOST"
          if [ -n "$FALTA" ]; then
            echo "FALHA: faltam segredos do repositório:$FALTA"
            echo "Cadastre em Settings → Secrets and variables → Actions → New repository secret."
            echo "  VPS_SSH_KEY — chave PRIVADA que já tenha acesso root na VPS (conteúdo inteiro, com BEGIN/END)"
            echo "  VPS_HOST    — IP ou host da VPS"
            echo "  VPS_USER    — opcional, padrão root"
            exit 1
          fi

      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # A chave do host entra por `ssh-keyscan` em vez de
          # `StrictHostKeyChecking=no`: aceitar qualquer host é aceitar também o
          # errado, e este passo carrega uma chave com root.
          # O runner pode perder a primeira conexão TCP mesmo quando a VPS está
          # saudável. Repetimos uma sondagem IPv4 em arquivo temporário, mas só
          # aceitamos continuar depois de obter uma chave de host não vazia.
          rm -f ~/.ssh/known_hosts
          for tentativa in 1 2 3; do
            if ssh-keyscan -4 -T 20 "$VPS_HOST" > ~/.ssh/known_hosts.tmp 2>/dev/null && test -s ~/.ssh/known_hosts.tmp; then
              mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
              break
            fi
            rm -f ~/.ssh/known_hosts.tmp
            echo "A leitura da chave SSH não respondeu na tentativa ${tentativa}/3; aguardando para tentar novamente."
            sleep $((tentativa * 5))
          done
          test -s ~/.ssh/known_hosts || { echo "FALHA: não consegui ler a chave de host de $VPS_HOST"; exit 1; }

      # A VPS só é alcançável por SSH, e nem toda pessoa que precisa publicar
      # tem terminal aberto. Este passo sincroniza a conexão de banco e as
      # chaves de cobrança do cofre do repositório para o `.env.backend` da
      # VPS, sem imprimir valores e sem tocar em outras linhas do arquivo.
      #
      # Faltando qualquer uma das sete, o passo não escreve nada e avisa: meia
      # configuração deixaria `isConfigured()` falso do mesmo jeito, só que com
      # um arquivo remendado no meio.
      - name: Sincronizar segredos operacionais
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BILLING_PROVIDER: ${{ secrets.BILLING_PROVIDER }}
          CAKTO_CLIENT_ID: ${{ secrets.CAKTO_CLIENT_ID }}
          CAKTO_CLIENT_SECRET: ${{ secrets.CAKTO_CLIENT_SECRET }}
          CAKTO_WEBHOOK_SECRET: ${{ secrets.CAKTO_WEBHOOK_SECRET }}
          CAKTO_SUBSCRIPTION_PRODUCT_ID: ${{ secrets.CAKTO_SUBSCRIPTION_PRODUCT_ID }}
          CAKTO_LIFETIME_PRODUCT_ID: ${{ secrets.CAKTO_LIFETIME_PRODUCT_ID }}
          CAKTO_MONTHLY_OFFER_ID: ${{ secrets.CAKTO_MONTHLY_OFFER_ID }}
          CAKTO_ANNUAL_OFFER_ID: ${{ secrets.CAKTO_ANNUAL_OFFER_ID }}
          CAKTO_LIFETIME_OFFER_ID: ${{ secrets.CAKTO_LIFETIME_OFFER_ID }}
        run: |
          set -eu
          if [ -z "$DATABASE_URL" ]; then
            echo "FALHA: o segredo DATABASE_URL é necessário para aplicar migrações com a conexão atual."
            echo "Cadastre-o em Settings → Secrets and variables → Actions antes de publicar."
            exit 1
          fi
          CHAVES="CAKTO_CLIENT_ID CAKTO_CLIENT_SECRET CAKTO_WEBHOOK_SECRET
            CAKTO_SUBSCRIPTION_PRODUCT_ID CAKTO_LIFETIME_PRODUCT_ID
            CAKTO_MONTHLY_OFFER_ID CAKTO_ANNUAL_OFFER_ID CAKTO_LIFETIME_OFFER_ID"
          FALTA=""
          for CHAVE in $CHAVES; do
            eval "VALOR=\${$CHAVE}"
            [ -n "$VALOR" ] || FALTA="$FALTA $CHAVE"
          done
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            # As migrações executam com DIRECT_URL; no pooler de sessão
            # autorizado a mesma conexão serve aos dois usos.
            echo "DIRECT_URL=${DATABASE_URL}"
          } > pares.env

          if [ -n "$FALTA" ]; then
            echo "AVISO: segredos de cobrança ausentes:$FALTA"
            echo "O deploy segue com a conexão de banco sincronizada; o checkout fica"
            echo "indisponível até os segredos Cakto serem configurados."
          else
            # O corpo vai por stdin e é lido pelo shell remoto sem aparecer em
            # linha de comando — argumento de `ssh` fica visível no `ps` da VPS.
            {
            echo "BILLING_PROVIDER=${BILLING_PROVIDER:-cakto}"
            for CHAVE in $CHAVES; do
              eval "VALOR=\${$CHAVE}"
              echo "${CHAVE}=${VALOR}"
            done
            } >> pares.env
          fi

          USER_FINAL="${VPS_USER:-root}"
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=30 "${USER_FINAL}@${VPS_HOST}" \
            'set -eu
             cd /opt/airia/app/deploy/airia
             touch .env.backend
             cp .env.backend ".env.backend.bak.$(date -u +%Y%m%dT%H%M%SZ)"
             TMP="$(mktemp)"
             PARES="$(cat)"
             # Preserva toda linha que não seja uma das chaves enviadas.
             CHAVES_ENVIADAS="$(printf %s "$PARES" | cut -d= -f1)"
             # `|| [ -n "$LINHA" ]` porque arquivo sem quebra final perderia a
             # última linha — e aqui a última linha é segredo de produção.
             while IFS= read -r LINHA || [ -n "$LINHA" ]; do
               NOME="${LINHA%%=*}"
               MANTER=1
               for CHAVE in $CHAVES_ENVIADAS; do
                 [ "$NOME" = "$CHAVE" ] && MANTER=0
               done
               [ "$MANTER" = 1 ] && printf "%s\n" "$LINHA"
               LINHA=""
             done < .env.backend > "$TMP"
             printf "%s\n" "$PARES" >> "$TMP"
             mv "$TMP" .env.backend
             chmod 600 .env.backend
             echo "chaves de cobrança gravadas: $(printf "%s\n" "$CHAVES_ENVIADAS" | wc -l)"' < pares.env
          rm -f pares.env

      - name: Publicar na VPS com código do GitHub
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          USER_FINAL="${VPS_USER:-root}"
          # O build agora acontece na VPS a partir de um clone LIMPO do GitHub,
          # autenticado com o GITHUB_TOKEN do próprio workflow. A causa raiz
          # do freeze era um repositório local na VPS que buildava um código
          # diferente do versionado; clonar por https elimina essa classe de
          # problema e dispensa o checkout/working-tree local por completo.
          AUTH_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Transfere o script de deploy NOVO para a VPS (o repositório local
          # dela pode estar desatualizado e não conter o arquivo).
          echo "SHA do checkout no runner: $(git rev-parse HEAD)"
          echo "SHA do script no runner:  $(git hash-object deploy/airia/deploy-from-github.sh)"
          scp -i ~/.ssh/id_deploy -o ConnectTimeout=30 deploy/airia/deploy-from-github.sh "${USER_FINAL}@${VPS_HOST}":/tmp/deploy-from-github.sh
          # Na VPS, confirma qual script chegou (hash) e se o /tmp é o que
          # esperamos antes de executar.
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=30 "${USER_FINAL}@${VPS_HOST}" \
            "echo 'SHA do arquivo recebido na VPS:' \"\$(git hash-object /tmp/deploy-from-github.sh 2>/dev/null || sha256sum /tmp/deploy-from-github.sh | cut -d' ' -f1)\"; echo 'SHA local da VPS (script operacional):' \"\$(git -C /opt/airia/app hash-object deploy/airia/deploy-from-github.sh 2>/dev/null || echo indisponivel)\""
          # Executa o deploy clonando o código limpo do GitHub. Ao final, o
          # script copia a si mesmo para o repo da VPS para execuções futuras.
          ssh -i ~/.ssh/id_deploy -o ConnectTimeout=30 "${USER_FINAL}@${VPS_HOST}" \
            "sh /tmp/deploy-from-github.sh '${AUTH_URL}' '${REF}'"

      - name: Conferir o que está no ar
        if: always()
        run: |
          # Roda mesmo se o passo anterior falhar: deploy que quebra no meio
          # deixa a produção em algum estado, e não saber qual é pior.
          for URL in https://airia.pro/ https://www.airia.pro/ https://airia.pro/api/health; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo 000)"
            echo "$URL -> HTTP $CODE"
          done
