name: CI

# Espelha o build que a VPS roda no deploy + os testes do repo.
# Se este workflow passar, o build do deploy passa. Pega erro de tipo/build
# ANTES de chegar na VPS (ex.: prisma.checkin, today not defined, topThemes).

on:
  push:
    branches:
      - feat/navigation-planner-ui-backend
      - master
  pull_request:

# Cancela runs antigos da mesma branch/PR quando chega push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Build (mesma ordem do Dockerfile.backend da VPS) ----
      - name: Prisma generate
        run: npm run generate -w packages/database

      - name: Build database package
        run: npm run build -w packages/database

      - name: Build backend (tsc)
        run: npm run build -w apps/backend

      - name: Typecheck web
        run: npm run typecheck -w apps/web

      - name: Build web (vite)
        run: npm run build -w apps/web

      # ---- Testes ----
      - name: Test web (vitest)
        run: npm run test -w apps/web

      - name: Test backend (contract + unit)
        run: npm run test -w apps/backend
