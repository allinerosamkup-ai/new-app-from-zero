server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Páginas estáticas para crawlers do Google OAuth Verification
  location = /privacy {
    try_files /privacy.html =404;
  }
  location = /terms {
    try_files /terms.html =404;
  }

  # O shell e o service worker nunca podem ficar presos em cache antigo.
  # Assets com hash continuam sendo cacheados pelo navegador/Workbox.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /sw.js =404;
  }
  location = /release.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /release.json =404;
  }
  location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback para todas as outras rotas
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location /api/ {
    set $backend_upstream airia_backend:3001;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }
}
