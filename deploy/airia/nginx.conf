server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # NÃO redirecionar www para o host sem www. A consolidação de busca é feita
  # pela tag `rel=canonical`, que já aponta para https://airia.pro/.
  #
  # O 301 existiu por duas horas em 2026-08-09 e quebrou o app em produção. O
  # PWA está instalado em `www.airia.pro`, e um redirecionamento de host atinge
  # **todas** as rotas, inclusive `/api/`:
  #
  #   "POST /api/checkins HTTP/1.1" 301   referer: https://www.airia.pro/checkin
  #   "GET  /api/checkins HTTP/1.1" 401   referer: https://www.airia.pro/
  #
  # POST redirecionado não é reenviado como POST, e o cabeçalho `Authorization`
  # é descartado no salto entre origens. Resultado: check-in não salvava e o app
  # abria sem histórico. Pior, `localStorage` é por origem — a sessão e o cache
  # do PWA vivem em www e não acompanhariam a mudança.
  #
  # Se um dia o host for mesmo unificado, o caminho é: excluir `/api/` do
  # redirecionamento, avisar quem tem o PWA instalado que precisará entrar de
  # novo, e só então ligar. `rel=canonical` resolve a busca sem nada disso.

  # Páginas estáticas para crawlers do Google OAuth Verification
  location = /privacy {
    try_files /privacy.html =404;
  }
  location = /terms {
    try_files /terms.html =404;
  }

  # O shell e o service worker nunca podem ficar presos em cache antigo.
  # Assets com hash continuam sendo cacheados pelo navegador/Workbox.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /sw.js =404;
  }
  location = /release.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /release.json =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /manifest.webmanifest =404;
  }
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ^~ /icons/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location ^~ /screenshots/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  # `webp` entrou junto com o mascote: são 16 arquivos e ~420 KB que, sem esta
  # linha, caíam no fallback da SPA e eram revalidados a cada carregamento.
  location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Arquivos de indexação. Precisam de 404 real quando faltarem: hoje o
  # fallback da SPA devolve o index.html com HTTP 200, e um robots.txt que
  # responde HTML é pior que um ausente — o buscador tenta interpretar.
  location = /robots.txt {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /robots.txt =404;
  }
  location = /sitemap.xml {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files /sitemap.xml =404;
  }

  # A raiz com `?lang=en` recebe o head em inglês.
  #
  # O SEO em tempo de execução resolve o Google, que executa JS. Não resolve
  # prévia de link: WhatsApp, Slack e X leem o HTML cru. Sem isto, link em
  # inglês se apresenta em português. `dist/index.en.html` é a mesma aplicação
  # com outro `<head>` — mesmos assets, mesmo bundle.
  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    if ($arg_lang = "en") {
      rewrite ^ /index.en.html last;
    }
    try_files /index.html =404;
  }
  location = /index.en.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.en.html =404;
  }

  # `/livro` é a mesma aplicação com o `<head>` da página de vendas do e-book.
  #
  # Sem isto ela caía no fallback do SPA e herdava o `<head>` da raiz: canônica
  # apontando para `https://airia.pro/`, ou seja, a página se declarando
  # duplicata da home e sem como ser indexada por si; e a prévia do link — que
  # é o destino de anúncio pago — mostrando o print do app no lugar da capa.
  # `dist/livro.html` sai de `scripts/build-seo-html.mjs`, mesmo caminho do
  # `index.en.html`: mesmos assets, mesmo bundle, só o `<head>` muda.
  #
  # A barra final ganha a mesma resposta em vez de cair no fallback, senão
  # `/livro/` seria uma segunda URL servindo a página com a canônica errada.
  location = /livro {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /livro.html =404;
  }
  location = /livro/ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /livro.html =404;
  }

  # SPA fallback para todas as outras rotas
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location /api/ {
    set $backend_upstream airia_backend:3001;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }
}
