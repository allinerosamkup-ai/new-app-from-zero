<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square (cream) -->
  <rect width="512" height="512" rx="116" ry="116" fill="#FDF9F5"/>

  <!-- Main circles (scaled from 200x200 viewBox to 512) -->
  <!-- scale factor: 512/200 = 2.56, offset to center the 200x200 design in 512x512 -->
  <!-- original centers: (90,80), (130,85), (75,115), (125,120), center (100,100) -->
  <!-- scaled: x*2.56 + (512-200*2.56)/2 = x*2.56 + (512-512)/2 = x*2.56 -->

  <!-- cx=90*2.56=230.4, cy=80*2.56=204.8, r=42*2.56=107.5 — nectarine -->
  <circle cx="230" cy="205" r="108" fill="#F4A896" fill-opacity="0.85" stroke="white" stroke-width="4"/>
  <!-- cx=130*2.56=332.8, cy=85*2.56=217.6, r=32*2.56=81.9 — menthe -->
  <circle cx="333" cy="218" r="82" fill="#B8D9C8" fill-opacity="0.85" stroke="white" stroke-width="4"/>
  <!-- cx=75*2.56=192, cy=115*2.56=294.4, r=28*2.56=71.7 — lagune -->
  <circle cx="192" cy="294" r="72" fill="#8FB8C4" fill-opacity="0.85" stroke="white" stroke-width="4"/>
  <!-- cx=125*2.56=320, cy=120*2.56=307.2, r=30*2.56=76.8 — rosa -->
  <circle cx="320" cy="307" r="77" fill="#F0C4D4" fill-opacity="0.85" stroke="white" stroke-width="4"/>
  <!-- center cx=100*2.56=256, cy=100*2.56=256, r=16*2.56=40.96 — champagne -->
  <circle cx="256" cy="256" r="41" fill="#FDE8E3" fill-opacity="0.95" stroke="white" stroke-width="5"/>

  <!-- Constellation nodes (scaled) -->
  <g opacity="0.6">
    <circle cx="230" cy="205" r="4" fill="#F4A896"/>
    <circle cx="333" cy="218" r="4" fill="#F4A896"/>
    <circle cx="192" cy="294" r="4" fill="#F4A896"/>
    <circle cx="320" cy="307" r="4" fill="#F4A896"/>
    <circle cx="256" cy="256" r="4" fill="#F4A896"/>
  </g>
</svg>
