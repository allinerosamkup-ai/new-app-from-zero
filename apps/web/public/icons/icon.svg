<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE8E3"/>
      <stop offset="100%" style="stop-color:#F4A896"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8D9C8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#8FB8C4;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="120" ry="120" fill="url(#bg)"/>

  <!-- Wave decorations -->
  <path d="M80 330 Q140 295 200 330 Q260 365 320 330 Q380 295 440 330" stroke="url(#wave1)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M80 355 Q140 320 200 355 Q260 390 320 355 Q380 320 440 355" stroke="url(#wave1)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- Letter A -->
  <text x="256" y="290" font-family="Georgia, serif" font-size="240" font-weight="700" text-anchor="middle" fill="#C97060" opacity="0.92">A</text>

  <!-- Dot accent above A -->
  <circle cx="256" cy="128" r="18" fill="#96C7B3" opacity="0.85"/>
</svg>
