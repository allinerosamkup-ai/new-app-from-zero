<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Base estática em português: é o que crawler sem JS e prévia de link no
         WhatsApp/Slack enxergam. A versão em inglês é aplicada em tempo de
         execução por src/lib/seo.ts, que o Googlebot executa. -->
    <title>Airia — App de humor e energia para TDAH, bipolaridade e ciclotimia</title>
    <meta name="description" content="Faça check-ins de humor e energia, observe padrões, registre seu diário e transforme objetivos em próximas ações possíveis. Feito para TDAH, ciclotimia e bipolaridade tipo II. Grátis no beta." />
    <meta name="keywords" content="app de humor, diário de humor, rastreador de humor, energia, padrões de humor, TDAH, ciclotimia, bipolaridade tipo 2, saúde mental, autoconhecimento" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Airia" />

    <!-- Uma URL canônica por idioma. Sem isso, / e /splash servem a mesma
         página e disputam entre si na indexação. -->
    <link rel="canonical" href="https://airia.pro/" />
    <link rel="alternate" hreflang="pt-BR" href="https://airia.pro/" />
    <link rel="alternate" hreflang="en" href="https://airia.pro/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://airia.pro/" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#FDF9F5" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Airia" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple PWA — Otimizado iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Airia" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#FDF9F5" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon.svg" />

    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon.svg" />

    <link rel="icon" type="image/svg+xml" sizes="320x320" href="/mascot/phases/airia-bolinha-stable.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Airia — App de humor e energia para TDAH, bipolaridade e ciclotimia" />
    <meta property="og:description" content="Faça check-ins de humor e energia, observe padrões, registre seu diário e avance em objetivos com uma próxima ação possível. Grátis no beta." />
    <meta property="og:image" content="https://airia.pro/screenshots/home-page.png" />
    <meta property="og:image:alt" content="Tela inicial da Airia mostrando a fase do ciclo de humor e a próxima ação" />
    <meta property="og:url" content="https://airia.pro/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Airia" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Airia — App de humor e energia para TDAH, bipolaridade e ciclotimia" />
    <meta name="twitter:description" content="Faça check-ins de humor e energia, observe padrões, registre seu diário e avance em objetivos com uma próxima ação possível." />
    <meta name="twitter:image" content="https://airia.pro/screenshots/home-page.png" />
