<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airia — Ciclagem de Humor</title>
    <meta name="description" content="Seu assistente pessoal de ciclagem de humor. Entenda seus padrões, preveja suas fases." />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#F4A896" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Airia" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Airia — Ciclagem de Humor" />
    <meta property="og:description" content="Entenda seus padrões de humor. Preveja suas fases. Viva com mais consciência." />
    <meta property="og:image" content="/screenshots/home-page.png" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Links estáticos para crawlers (Google OAuth Verification) -->
    <!-- O crawler do Google não executa JS, então precisa ver esses links no HTML estático -->
    <noscript>
      <nav style="text-align:center;padding:24px;font-family:sans-serif;font-size:14px;color:#666">
        <p>Airia — Sincronizador Biológico de Humor e Energia</p>
        <a href="/privacy" style="color:#C5A593;margin:0 12px">Política de Privacidade</a>
        <a href="/terms" style="color:#C5A593;margin:0 12px">Termos de Uso</a>
      </nav>
    </noscript>
    <!-- Crawler-only: links semânticos visíveis para bots mas ocultos visualmente para users -->
    <footer aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">
      <a href="/privacy">Política de Privacidade</a>
      <a href="/terms">Termos de Uso</a>
      <a href="https://airia.pro">Página Inicial</a>
    </footer>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
